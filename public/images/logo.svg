<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="softBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#047857" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#primaryGreen)" filter="url(#shadow)" />
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#goldGradient)" stroke-width="4" />
  
  <!-- Outer Ring Band for Text -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4" />
  <circle cx="250" cy="250" r="172" fill="url(#softBg)" stroke="url(#goldGradient)" stroke-width="3" />

  <!-- Circular Text Paths -->
  <!-- Upper arc (reads clockwise from left to right) -->
  <path id="arcUpper" d="M 75 250 A 175 175 0 1 1 425 250" fill="none" />
  <!-- Lower arc (reads clockwise along bottom) -->
  <path id="arcLower" d="M 425 250 A 175 175 0 0 1 75 250" fill="none" />

  <!-- Top Text -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="16.5" font-weight="900" fill="#ffffff" letter-spacing="3.2">
    <textPath href="#arcUpper" startOffset="50%" text-anchor="middle">
      KANTIN KOPERASI RSIA AISYIYAH
    </textPath>
  </text>

  <!-- Bottom Text -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="16" font-weight="900" fill="#fef08a" letter-spacing="4.5">
    <textPath href="#arcLower" startOffset="50%" text-anchor="middle">
      PEKAJANGAN
    </textPath>
  </text>

  <!-- Separator Stars between top and bottom text -->
  <g fill="#fbbf24">
    <!-- Left Star -->
    <path d="M 68 250 L 71 257 L 78 257 L 73 261 L 75 268 L 68 264 L 62 268 L 64 261 L 59 257 L 66 257 Z" transform="translate(0, -7)" />
    <!-- Right Star -->
    <path d="M 432 250 L 435 257 L 442 257 L 437 261 L 439 268 L 432 264 L 426 268 L 428 261 L 423 257 L 430 257 Z" transform="translate(0, -7)" />
  </g>

  <!-- CENTER EMBLEM -->
  <!-- Aisyiyah Sunray Rays (12 rays) -->
  <g transform="translate(250, 185)">
    <g stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="-50" x2="0" y2="-40" />
      <line x1="25" y1="-43" x2="20" y2="-34" />
      <line x1="43" y1="-25" x2="34" y2="-20" />
      <line x1="50" y1="0" x2="40" y2="0" />
      <line x1="43" y1="25" x2="34" y2="20" />
      <line x1="25" y1="43" x2="20" y2="34" />
      <line x1="0" y1="50" x2="0" y2="40" />
      <line x1="-25" y1="43" x2="-20" y2="34" />
      <line x1="-43" y1="25" x2="-34" y2="20" />
      <line x1="-50" y1="0" x2="-40" y2="0" />
      <line x1="-43" y1="-25" x2="-34" y2="-20" />
      <line x1="-25" y1="-43" x2="-20" y2="-34" />
    </g>

    <!-- Sunray center disk -->
    <circle cx="0" cy="0" r="34" fill="#ffffff" stroke="url(#goldGradient)" stroke-width="2.5" />

    <!-- Medical Green Cross -->
    <rect x="-6" y="-20" width="12" height="40" rx="3" fill="#059669" />
    <rect x="-20" y="-6" width="40" height="12" rx="3" fill="#059669" />
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
  </g>

  <!-- CANTEEN ELEMENTS (Serving Plate, Dome & Warm Aroma) -->
  <g transform="translate(250, 290)">
    <!-- Serving Cloche Cover -->
    <path d="M -58 0 C -58 -42 58 -42 58 0 Z" fill="url(#primaryGreen)" />
    <!-- Cloche Knob -->
    <circle cx="0" cy="-44" r="8" fill="url(#goldGradient)" />

    <!-- Serving Platter / Base -->
    <rect x="-74" y="2" width="148" height="10" rx="5" fill="url(#goldGradient)" />
    <rect x="-82" y="14" width="164" height="6" rx="3" fill="#047857" />

    <!-- Fork & Spoon Accent underneath -->
    <g opacity="0.8" fill="#059669">
      <!-- Spoon Left -->
      <path d="M -40 26 C -44 26 -47 30 -47 35 C -47 40 -43 43 -38 44 L -38 56 L -35 56 L -35 44 C -30 43 -26 40 -26 35 C -26 30 -29 26 -33 26 Z" />
      <!-- Fork Right -->
      <path d="M 28 26 L 28 36 C 28 39 31 42 34 43 L 34 56 L 37 56 L 37 43 C 40 42 43 39 43 36 L 43 26 L 40 26 L 40 34 L 38 34 L 38 26 L 36 26 L 36 34 L 34 34 L 34 26 Z" />
    </g>

    <!-- Warm steam gentle curves above cloche -->
    <path d="M -18 -50 Q -14 -60 -18 -70" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <path d="M 0 -54 Q 4 -66 0 -76" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" opacity="0.95" />
    <path d="M 18 -50 Q 22 -60 18 -70" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Ribbon / Banner across center bottom: PELAYANAN SEHAT -->
  <g transform="translate(250, 375)">
    <rect x="-70" y="-12" width="140" height="24" rx="12" fill="url(#goldGradient)" />
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="11" font-weight="900" fill="#064e3b" text-anchor="middle" y="4" letter-spacing="1.5">
      KANTIN SEHAT
    </text>
  </g>
</svg>