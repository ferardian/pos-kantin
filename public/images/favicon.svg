<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring Background -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 6" />
  <circle cx="250" cy="250" r="208" fill="#ffffff" />

  <!-- Inner Circle Soft Green Tint -->
  <circle cx="250" cy="250" r="195" fill="#f0fdf4" />

  <!-- Medical Cross Accent (RSIA Emblem) in upper center -->
  <g transform="translate(250, 160)">
    <!-- Golden Sunburst Ring -->
    <circle cx="0" cy="0" r="38" fill="#ecfdf5" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Medical Cross -->
    <rect x="-7" y="-22" width="14" height="44" rx="4" fill="#059669" />
    <rect x="-22" y="-7" width="44" height="14" rx="4" fill="#059669" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>

  <!-- Canteen & Shopping Icon (Coffee Cup & Fork/Spoon Tray) -->
  <g transform="translate(250, 275)">
    <!-- Food Cloche / Warm Bowl / Cup -->
    <path d="M -75 25 C -75 55 -40 70 0 70 C 40 70 75 55 75 25 Z" fill="url(#bgGrad)" />
    <!-- Tray / Plate base -->
    <rect x="-90" y="72" width="180" height="12" rx="6" fill="url(#goldGrad)" />

    <!-- Cloche dome cover -->
    <path d="M -65 15 C -65 -35 65 -35 65 15 Z" fill="#047857" opacity="0.9" />
    <!-- Cloche handle -->
    <circle cx="0" cy="-42" r="10" fill="url(#goldGrad)" />

    <!-- Steam Waves -->
    <path d="M -25 -55 Q -20 -70 -25 -82 Q -30 -94 -25 -105" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <path d="M 0 -58 Q 5 -73 0 -85 Q -5 -97 0 -110" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.95" />
    <path d="M 25 -55 Q 30 -70 25 -82 Q 20 -94 25 -105" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Circular Badge Text: KOPERASI KANTIN RSIA AISYIYAH -->
  <path id="textArcTop" d="M 95 250 A 155 155 0 0 1 405 250" fill="none" />
  <path id="textArcBottom" d="M 405 250 A 155 155 0 0 1 95 250" fill="none" />

  <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#065f46" letter-spacing="4">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      PEKAJANGAN
    </textPath>
  </text>
  
  <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="900" fill="#047857" letter-spacing="3.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      KANTIN &bull; RSIA AISYIYAH
    </textPath>
  </text>

  <!-- Decorative Stars -->
  <polygon points="250,422 253,430 261,430 255,435 257,443 250,438 243,443 245,435 239,430 247,430" fill="#d97706" />
</svg>
