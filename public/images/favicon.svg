<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="emGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="innerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#047857" flood-opacity="0.25" />
    </filter>

    <!-- Top text arc: radius 195, centered vertically in green band -->
    <path id="topArc" d="M 57 250 A 195 195 0 0 1 443 250" fill="none" />
    <!-- Bottom text arc: radius 216, upright orientation, centered vertically in green band -->
    <path id="bottomArc" d="M 110 415 A 216 216 0 0 0 390 415" fill="none" />
  </defs>

  <!-- Base Outer Circle (Radius 242) -->
  <circle cx="250" cy="250" r="242" fill="url(#emGreen)" filter="url(#badgeShadow)" />

  <!-- Outer Fine Gold Ring (Radius 232) -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Inner Edge of Green Band (Radius 160) -->
  <circle cx="250" cy="250" r="160" fill="url(#innerBg)" stroke="url(#goldGrad)" stroke-width="3.5" />

  <!-- TOP CIRCULAR TEXT: KANTIN KOPERASI RSIA AISYIYAH -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="20.5" font-weight="900" fill="#ffffff" letter-spacing="3.8">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      KANTIN KOPERASI RSIA AISYIYAH
    </textPath>
  </text>

  <!-- BOTTOM CIRCULAR TEXT: PEKAJANGAN -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="22" font-weight="900" fill="#fef08a" letter-spacing="6.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      PEKAJANGAN
    </textPath>
  </text>

  <!-- SEPARATOR GOLDEN STARS (Centered in green band at radius 195, y=250) -->
  <g transform="translate(57, 250)" fill="url(#goldGrad)">
    <polygon points="0,-10 2.8,-3.2 9,-3.2 4,1.2 5.8,8 0,4 -5.8,8 -4,1.2 -9,-3.2 -2.8,-3.2" />
  </g>
  <g transform="translate(443, 250)" fill="url(#goldGrad)">
    <polygon points="0,-10 2.8,-3.2 9,-3.2 4,1.2 5.8,8 0,4 -5.8,8 -4,1.2 -9,-3.2 -2.8,-3.2" />
  </g>

  <!-- ==================== CENTER ARTWORK ==================== -->

  <!-- 1. AISYIYAH SUNBURST & MEDICAL CROSS -->
  <g transform="translate(250, 168)">
    <!-- 12 Rays in Gold -->
    <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.95">
      <line x1="0" y1="-43" x2="0" y2="-35" />
      <line x1="21.5" y1="-37" x2="17.5" y2="-30" />
      <line x1="37" y1="-21.5" x2="30" y2="-17.5" />
      <line x1="43" y1="0" x2="35" y2="0" />
      <line x1="37" y1="21.5" x2="30" y2="17.5" />
      <line x1="21.5" y1="37" x2="17.5" y2="30" />
      <line x1="0" y1="43" x2="0" y2="35" />
      <line x1="-21.5" y1="37" x2="-17.5" y2="30" />
      <line x1="-37" y1="21.5" x2="-30" y2="17.5" />
      <line x1="-43" y1="0" x2="-35" y2="0" />
      <line x1="-37" y1="-21.5" x2="-30" y2="-17.5" />
      <line x1="-21.5" y1="-37" x2="-17.5" y2="-30" />
    </g>

    <!-- Sunray Center Disc -->
    <circle cx="0" cy="0" r="29" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Green Medical Cross -->
    <rect x="-5" y="-17" width="10" height="34" rx="2.5" fill="#059669" />
    <rect x="-17" y="-5" width="34" height="10" rx="2.5" fill="#059669" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>

  <!-- 2. CANTEEN SERVING CLOCHE & TRAY -->
  <g transform="translate(250, 260)">
    <!-- Serving Cloche Cover -->
    <path d="M -50 0 C -50 -35 50 -35 50 0 Z" fill="url(#emGreen)" />
    <!-- Cloche Gold Knob -->
    <circle cx="0" cy="-37" r="7" fill="url(#goldGrad)" />

    <!-- Serving Platter Base -->
    <rect x="-64" y="2" width="128" height="8" rx="4" fill="url(#goldGrad)" />
    <rect x="-70" y="12" width="140" height="5" rx="2.5" fill="#047857" />

    <!-- Warm Steam Curves -->
    <path d="M -15 -43 Q -11 -51 -15 -58" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <path d="M 0 -46 Q 3 -54 0 -62" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.95" />
    <path d="M 15 -43 Q 19 -51 15 -58" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

    <!-- Fork & Spoon Accent -->
    <g fill="#059669" opacity="0.85">
      <!-- Spoon Left -->
      <path d="M -32 22 C -36 22 -39 25 -39 29 C -39 33 -36 36 -32 37 L -32 46 L -29 46 L -29 37 C -25 36 -22 33 -22 29 C -22 25 -25 22 -29 22 Z" />
      <!-- Fork Right -->
      <path d="M 23 22 L 23 30 C 23 33 26 35 29 36 L 29 46 L 32 46 L 32 36 C 35 35 38 33 38 30 L 38 22 L 35 22 L 35 28 L 33 28 L 33 22 L 31 22 L 31 28 L 29 28 L 29 22 Z" />
    </g>
  </g>

  <!-- 3. RIBBON BANNER: KANTIN SEHAT -->
  <g transform="translate(250, 328)">
    <rect x="-62" y="-11" width="124" height="22" rx="11" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.75" />
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="11" font-weight="900" fill="#064e3b" text-anchor="middle" y="4.5" letter-spacing="1.5">
      KANTIN SEHAT
    </text>
  </g>
</svg>